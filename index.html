<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Web Sayfası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 12px;
        }
        p.tagline {
            color: #3498db;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        p.bio {
            line-height: 1.6;
            color: #555;
            font-size: 1rem;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Buraya Adınızı ve Soyadınızı Yazın -->
        <h1>Adınız Soyadınız</h1>
        
        <p class="tagline">Öğrenci / Web Geliştirici Adayı</p>
        
        <!-- Kısa Açıklama -->
        <p class="bio">
            Merhaba! Bu web sayfası İnternet Teknolojileri dersi ödevi kapsamında hazırlanmıştır. 
            ClouDNS üzerinden DNS konfigürasyonları (A, CNAME, MX, NS) tamamlanarak yayına alınmıştır.
        </p>

        <div class="footer-note">
            © 2026 Kişisel Web Sayfası - Tüm Hakları Saklıdır.
        </div>
    </div>

</body>
</html>
